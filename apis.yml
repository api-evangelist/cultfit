aid: cultfit
name: Cult.fit
description: 'Cult.fit (Curefit / cure.fit, operated by Diverse Retails Private Limited) is an Indian
  health and fitness company offering a connected consumer experience across group fitness classes,
  gyms, at-home workouts, mental well-being and meditation, healthy food, and diagnostics. Its
  flagship products include CultPass gym and class memberships, sport and fitness centers, live and
  on-demand digital workouts, and the cult.fit and cure.fit mobile and web apps. Backed by Accel and
  other investors, the company operates a large consumer platform but does not publish a public
  developer API program; this API Evangelist profile captures its company identity, corporate web
  properties, and engineering surface (the curefit GitHub organization and engineering blog).'
